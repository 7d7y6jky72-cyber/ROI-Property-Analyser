<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1720">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Investment Portfolio Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="expenses.css">
  <link rel="stylesheet" href="forecast.css">
  <link rel="stylesheet" href="shares.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Back">←</button>
    <div><span class="eyebrow">INVESTMENT PORTFOLIO</span><h1 id="pageTitle">Overview</h1></div>
    <button id="headerAction" class="primary">+ Property</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-route="portfolio" class="active"><span>⌂</span>Portfolio</button>
    <button data-route="backup"><span>⇅</span>Backup</button>
    <button data-route="about"><span>ⓘ</span>Guide</button>
  </nav>

  <dialog id="propertyDialog"><form id="propertyForm" method="dialog"></form></dialog>
  <dialog id="expenseDialog"><form id="expenseForm" method="dialog"></form></dialog>
  <dialog id="valuationDialog"><form id="valuationForm" method="dialog"></form></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
  <script src="strategy.js"></script>
  <script src="expenses.js"></script>
  <script src="shares.js"></script>
  <script src="share-fixes.js"></script>
</body>
</html>
